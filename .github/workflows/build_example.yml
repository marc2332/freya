name: Build example

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS"
        required: true
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - windows-latest
      example_name:
        description: "Example name"
        required: true
      optimize_for_size:
        description: "Optimize for smaller binaries"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    if: ${{ always() }}
    env:
      BUILD_PROFILE: ${{ inputs.optimize_for_size && 'size-release' || 'release' }}
      CARGO_TARGET_DIR: target
      EXAMPLE_NAME: ${{ inputs.example_name }}
    strategy:
      matrix:
        os: ["${{ inputs.os }}"]
      fail-fast: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          submodules: true
      - name: Install linux dependencies
        if: runner.os == 'Linux'
        background: true
        run: |
          sudo apt update && sudo apt install build-essential libssl-dev pkg-config libudev-dev libasound2-dev liblzma-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libwayland-dev
      - name: Install stable rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Set up cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "rust-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Wait for setup
        wait-all:

      - name: Build example
        shell: bash
        run: cargo build --locked --example "$EXAMPLE_NAME" --profile "$BUILD_PROFILE"
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-Ctarget-feature=+crt-static' || '' }}

      - name: Upload example binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.EXAMPLE_NAME }}-${{ matrix.os }}-${{ env.BUILD_PROFILE }}
          path: target/${{ env.BUILD_PROFILE }}/examples/${{ env.EXAMPLE_NAME }}${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
