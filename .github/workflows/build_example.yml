name: Build example

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS"
        required: true
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-latest
      example_name:
        description: "Example name"
        required: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    if: ${{ always() }}
    strategy:
      matrix:
        os: ["${{ inputs.os }}"]
      fail-fast: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          submodules: true
      - name: Install stable rust toolchain
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97
      - name: Set up cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "rust-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt install -y build-essential libssl-dev pkg-config libglib2.0-dev libgtk-3-dev libudev-dev libxdo-dev libwebkit2gtk-4.1-dev libasound2-dev libxkbcommon-x11-0 xvfb xauth dbus-x11 xdotool imagemagick

      - name: Build example
        run: cargo build --locked --example "$EXAMPLE_NAME" --release
        shell: bash
        env:
          EXAMPLE_NAME: ${{ inputs.example_name }}
          FORCE_SKIA_BINARIES_DOWNLOAD: "1"
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-Ctarget-feature=+crt-static' || '' }}

      - name: Smoke test Linux example
        if: runner.os == 'Linux'
        timeout-minutes: 1
        shell: bash
        env:
          EXAMPLE_NAME: ${{ inputs.example_name }}
          FREYA_RENDERER: software
          LIBGL_ALWAYS_SOFTWARE: "1"
          RUST_BACKTRACE: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" dbus-run-session -- \
            timeout --kill-after=5s 45s bash .github/scripts/smoke-linux-example.sh

      - name: Upload Linux screenshot
        if: ${{ !cancelled() && runner.os == 'Linux' && hashFiles('artifacts/linux-smoke.png') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-smoke-${{ matrix.os }}
          path: artifacts/linux-smoke.png
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: target/release/examples/*
