on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/torin/**/*'
      - '.github/workflows/benchmarks.yml'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'

name: Run Benchmarks
jobs:
  runBenchmark:
    name: run benchmark
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      pull-requests: write
      contents: read
    concurrency:
      group: benchmarks-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: useblacksmith/checkout@v1 # v6.0.2
        with:
          submodules: true
      - uses: boa-dev/criterion-compare-action@59f4d964c5f19d7f13d36f5c0944b18ce6652cb0
        with:
          package: torin
          branchName: ${{ github.base_ref }}
          token: ${{ github.token }}
