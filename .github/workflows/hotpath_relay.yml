name: Hotpath relay

on:
  workflow_run:
    workflows: [Hotpath]
    types: [completed]

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        benchmark: [dev_perf-icount, core-icount, painting-icount, torin-icount]
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@v0.29.1
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    with:
      benchmark: ${{ matrix.benchmark }}
      artifact_name: hotpath-${{ matrix.benchmark }}
      report_file: report.json
