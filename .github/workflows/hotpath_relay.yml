name: Hotpath relay

on:
  workflow_run:
    workflows: [Hotpath]
    types: [completed]

jobs:
  dev:
    uses: pawurb/hotpath-rs/.github/workflows/hotpath-relay.yml@v0.28.0
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      benchmark: dev_perf
      artifact_name: hotpath-dev
      report_file: dev_perf.json
  core:
    uses: pawurb/hotpath-rs/.github/workflows/hotpath-relay.yml@v0.28.0
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      benchmark: core
      artifact_name: hotpath-core
      report_file: core.json
