name: Hotpath relay

on:
  workflow_run:
    workflows: [Hotpath]
    types: [completed]

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - benchmark: dev_perf
            artifact: hotpath-dev
            report: dev_perf.json
          - benchmark: core
            artifact: hotpath-core
            report: core.json
          - benchmark: painting
            artifact: hotpath-painting
            report: painting.json
          - benchmark: torin
            artifact: hotpath-torin
            report: torin.json
          - benchmark: torin-criterion-binary-12
            artifact: hotpath-torin-criterion-binary-12
            report: torin-criterion-binary-12.json
          - benchmark: torin-criterion-wide-5-cached
            artifact: hotpath-torin-criterion-wide-5-cached
            report: torin-criterion-wide-5-cached.json
          - benchmark: torin-criterion-aligned-8
            artifact: hotpath-torin-criterion-aligned-8
            report: torin-criterion-aligned-8.json
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@6611490c8b1b33b69c4845e86daa450a50f461c6 # v0.30.0
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    with:
      benchmark: ${{ matrix.benchmark }}
      artifact_name: ${{ matrix.artifact }}
      report_file: ${{ matrix.report }}
