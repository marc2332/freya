name: Publish Sponsors
on:
  workflow_dispatch:
  schedule:
    - cron: 30 15 * * 0-6

permissions:
  contents: read

concurrency:
  group: update-sponsors
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'marc2332/freya'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Generate Sponsors 💖
        uses: JamesIves/github-sponsors-readme-action@2fd9142e765f755780202122261dc85e78459405 # v1.6.0
        with:
          token: ${{ secrets.PAT }}
          file: 'README.md'

      - name: Create sponsors pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT }}
          add-paths: README.md
          base: main
          branch: automation/update-sponsors
          delete-branch: true
          commit-message: 'docs: update sponsors'
          title: 'docs: update sponsors'
          body: Update the README sponsor list from GitHub Sponsors.
