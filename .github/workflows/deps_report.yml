name: Dependencies Report

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Dependency report (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: deps-report-${{ matrix.os }}-${{ github.ref_name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: blacksmith-4vcpu-ubuntu-2604
          - os: windows-latest
            runner: blacksmith-4vcpu-windows-2025
          - os: macos-latest
            runner: blacksmith-6vcpu-macos-15

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
        submodules: true
    - name: Install linux dependencies
      if: runner.os == 'Linux'
      background: true
      run: sudo apt update && sudo apt install build-essential libssl-dev pkg-config libudev-dev libasound2-dev liblzma-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libwayland-dev
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
    - name: Install just
      uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9 # v2.75.1
      with:
        tool: just
    - name: Set up cargo cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        shared-key: "deps-report-${{ matrix.runner }}"
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Wait for setup
      wait-all:
    - name: Build with default features
      run: just bd

    - name: Count dependencies
      shell: bash
      run: |
        count=$(just deps-count)
        echo "$count"
        echo "${{ matrix.os }}: $count" >> "$GITHUB_STEP_SUMMARY"
