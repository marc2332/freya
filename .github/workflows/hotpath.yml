name: Hotpath

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hotpath:
    runs-on: ubuntu-latest
    concurrency:
      group: hotpath-${{ github.ref }}
      # A cancelled push run leaves its commit without a baseline.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Install just
        uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9 # v2.75.1
        with:
          tool: just
      - name: Install linux dependencies
        run: |
          sudo apt update && sudo apt install build-essential libssl-dev pkg-config libglib2.0-dev libgtk-3-dev libudev-dev libxdo-dev libwebkit2gtk-4.1-dev libasound2-dev
      - name: Dev benchmark
        env:
          HOTPATH_BENCHMARK: dev_perf
          HOTPATH_UPLOAD: ${{ github.event_name == 'push' && 'fail-on-error' || '0' }}
          HOTPATH_OUTPUT_FORMAT: ${{ github.event_name == 'push' && 'none' || 'json' }}
          HOTPATH_OUTPUT_PATH: ${{ github.workspace }}/dev_perf.json
        run: just pd-ci
      - name: Core benchmark
        env:
          HOTPATH_BENCHMARK: core
          HOTPATH_UPLOAD: ${{ github.event_name == 'push' && 'fail-on-error' || '0' }}
          HOTPATH_OUTPUT_FORMAT: ${{ github.event_name == 'push' && 'none' || 'json' }}
          HOTPATH_OUTPUT_PATH: ${{ github.workspace }}/core.json
        run: just pc-ci
      - name: Render benchmarks
        env:
          HOTPATH_BENCHMARK: render
          HOTPATH_UPLOAD: ${{ github.event_name == 'push' && 'fail-on-error' || '0' }}
          HOTPATH_OUTPUT_FORMAT: ${{ github.event_name == 'push' && 'none' || 'json' }}
          HOTPATH_OUTPUT_PATH: ${{ github.workspace }}/render.json
        run: just pr-ci
      - name: Upload dev report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hotpath-dev
          path: dev_perf.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload core report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hotpath-core
          path: core.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload render report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hotpath-render
          path: render.json
          retention-days: 1
          if-no-files-found: error
