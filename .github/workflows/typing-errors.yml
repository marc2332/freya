name: Typing errors

on:
  push:
    branches: [ "main" ]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  spelling:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: useblacksmith/checkout@v1 # v6.0.2
      - name: Spell check with typos
        uses: crate-ci/typos@7b04f660f4ee4f048d18fd341887cf28dfbedfe2 # v1.46.3
        with:
          isolated: true
          config: ./_typos.toml
          files: .
