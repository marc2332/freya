# Policy for the render benchmark.

pr_comment = "on_change"

[functions]
min_percent_total = 2

[functions.alloc]
judged = true
min_percent_change = 20
metrics = ["avg", "total"]
min_calls = 0

[functions.timing]
judged = false
min_percent_change = 50
metrics = ["avg", "total"]
min_calls = 10

[threads]
names = ["render_suite"]

[threads.alloc]
judged = false
min_percent_change = 20
metrics = ["total"]
