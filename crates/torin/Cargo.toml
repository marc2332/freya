[package]
name = "torin"
description = "UI layout Library designed for Freya."
version = "0.5.0-rc.13"
edition = "2024"
license = "MIT"
authors = ["Marc Espín <mespinsanz@gmail.com>"]
readme = "./README.md"
homepage = "https://freyaui.dev/"
repository = "https://github.com/marc2332/freya"
keywords = ["gui", "ui", "desktop", "skia", "freya"]
categories = ["gui", "caching"]

[lints]
workspace = true

[features]
default = ["std"]
std = [
  "euclid/std",
  "itertools/use_std",
  "rustc-hash/std",
  "serde?/std",
  "tracing/std",
  "tracing/attributes",
]
serde = ["dep:serde", "euclid/serde"]
hotpath = ["std", "dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cloud = ["hotpath", "hotpath/hotpath-cloud"]
hotpath-callgrind = ["hotpath", "hotpath/hotpath-callgrind"]

[dependencies]
hotpath = { workspace = true, optional = true }
tracing = { version = "0.1.41", default-features = false }
euclid = { version = "0.22.9", default-features = false, features = ["libm"] }
rustc-hash = { version = "2.1.1", default-features = false }
itertools = { version = "0.14.0", default-features = false, features = [
  "use_alloc",
] }
hashbrown = { version = "0.16.1", default-features = false }
libm = { version = "0.2", default-features = false }

serde = { version = "1.0", optional = true, default-features = false, features = [
  "alloc",
  "derive",
] }

[dev-dependencies]
criterion = "0.5.1"

[lib]
bench = false

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "callgrind"
harness = false
required-features = ["hotpath"]
