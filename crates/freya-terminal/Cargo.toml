[package]
name = "freya-terminal"
version = "0.5.0"
description = "Terminal emulator integration for Freya"
edition = "2024"
license = "MIT"
authors = ["Marc Espín <mespinsanz@gmail.com>"]
repository = "https://github.com/marc2332/freya"
keywords = ["gui", "ui", "desktop", "terminal", "pty"]
categories = ["gui"]

[lints]
workspace = true

[features]
default = ["pty"]
pty = ["dep:portable-pty"]

[dependencies]
freya-core = { workspace = true }
tiny-cache = { workspace = true }
tiny-notify = { workspace = true }
freya-engine = { workspace = true }
torin = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
keyboard-types = { workspace = true }

# Terminal emulator
rio-vt = { version = "=0.5.29", default-features = false }

# Built-in PTY backend
portable-pty = { version = "0.9", optional = true }

# URL detection in terminal output
linkify = { workspace = true }

# Async
futures-lite = { workspace = true }
futures-channel = { workspace = true }

[dev-dependencies]
freya = { path = "../freya" }
freya-testing = { workspace = true }
