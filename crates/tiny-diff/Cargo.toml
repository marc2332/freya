[package]
name = "tiny-diff"
version = "0.5.0-rc.13"
edition = "2024"
license = "MIT"
description = "Keyed tree diffing with no_std support"
repository = "https://github.com/marc2332/freya"

[lints]
workspace = true

[features]
default = []
std = ["rustc-hash/std"]
hotpath = ["std", "dep:hotpath", "hotpath/hotpath"]

[dependencies]
hotpath = { workspace = true, optional = true }
hashbrown = { version = "0.16", default-features = false }
rustc-hash = { version = "2.1.1", default-features = false }
