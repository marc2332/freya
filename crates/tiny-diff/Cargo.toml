[package]
name = "tiny-diff"
version = "0.5.0-beta.12"
edition = "2024"
license = "MIT"
description = "Keyed tree diffing with no_std support"
repository = "https://github.com/marc2332/freya"

[lints]
workspace = true

[features]
default = []
std = ["rustc-hash/std"]

[dependencies]
hashbrown = { version = "0.16", default-features = false }
rustc-hash = { version = "2.1.1", default-features = false }
