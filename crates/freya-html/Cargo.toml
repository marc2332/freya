[package]
name = "freya-html"
version.workspace = true
description = "HTML + CSS rendering for Freya using Blitz"
edition = "2024"
license = "MIT"
authors = ["Marc Espín <mespinsanz@gmail.com>"]
repository = "https://github.com/freya-rs/freya"
keywords = ["gui", "ui", "desktop", "html", "css"]
categories = ["gui"]

[lints]
workspace = true

[dependencies]
freya-components = { workspace = true, features = ["remote-asset"] }
freya-core = { workspace = true }
freya-engine = { workspace = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }

keyboard-types = { workspace = true }
smol_str = "0.3"

async-channel = { workspace = true }
futures-channel = { workspace = true }
futures-lite = { workspace = true }
parley = "0.13"

blitz-dom = { version = "=0.3.0-beta.5", features = ["default", "floats"] }
blitz-html = "=0.3.0-beta.5"
blitz-paint = "=0.3.0-beta.5"
blitz-traits = "=0.3.0-beta.5"
atomic_refcell = "0.1"

anyrender = "0.15"
kurbo = "0.13.1"
peniko = "0.6"
hashbrown = "0.17.0"
url = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
oaty = "0.2"

[dev-dependencies]
freya = { path = "../freya" }
freya-testing = { workspace = true }
freya-skia-safe = { workspace = true }
