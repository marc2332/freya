[package]
name = "freya-html"
version = "0.5.0-rc.5"
description = "HTML + CSS rendering for Freya using Blitz"
edition = "2024"
license = "MIT"
authors = ["Marc Espín <mespinsanz@gmail.com>"]
repository = "https://github.com/marc2332/freya"
keywords = ["gui", "ui", "desktop", "html", "css"]
categories = ["gui"]

[lints]
workspace = true

[dependencies]
freya-components = { workspace = true, features = ["remote-asset"] }
freya-core = { workspace = true }
freya-engine = { workspace = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }

keyboard-types = "=0.7.0"
smol_str = "0.3"

futures-channel = { workspace = true }
futures-lite = { workspace = true }

blitz-dom = { version = "=0.3.0-beta.2", features = ["default", "floats"] }
blitz-html = "=0.3.0-beta.2"
blitz-paint = "=0.3.0-beta.2"
blitz-traits = "=0.3.0-beta.2"
atomic_refcell = "0.1"

anyrender = "0.13"
kurbo = "0.13.1"
peniko = "0.6"
hashbrown = "0.17.0"
url = { workspace = true }

[target.'cfg(target_os = "emscripten")'.dependencies]
parley = "0.11"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
oaty = "0.2"

[dev-dependencies]
freya = { path = "../freya" }
